name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install certified numerical backend
        run: python -m pip install -r requirements.txt
      - name: Unit tests and package
        run: mvn --batch-mode verify
      - name: Native exact factorial smoke test
        run: java -cp target/classes programas.ParalellFactorial 100000 factorial-100000.txt
      - name: Certified complex smoke test
        run: java -cp target/classes programas.ComplexFactorial 1.1i 100 factorial-smoke.txt
